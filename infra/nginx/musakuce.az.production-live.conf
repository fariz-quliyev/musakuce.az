#
# This is NOT the same kind of file as the other two in this directory:
#   - musakuce.conf.template   — topology A (dedicated VPS, Musakuce's own
#     bundled `nginx` container owns 80/443). Not used in this deployment.
#   - musakuce.host-shared.conf.example — a generic, reusable SETUP GUIDE for
#     topology B (this deployment's actual topology: a shared VPS whose own
#     host-level Nginx already serves another site). Written before this
#     specific deployment existed, with ${-style} placeholder framing and
#     install instructions — intentionally left as-is; not updated by this
#     mirror. Its own note about adding Cloudflare real-IP config (in its
#     final comment block) predates knowing this deployment's real
#     constraints and doesn't match how the fix was actually applied below —
#     see docs/DEPLOYMENT.md for the accurate, current explanation.
#   - This file — a literal, dated snapshot of what's actually deployed,
#     for disaster-recovery / VPS-rebuild reference. The VPS itself remains
#     the source of truth; re-sync this file by hand after any future live
#     edit (see docs/DEPLOYMENT.md's Nginx section for the exact command).
#
# Restoring this on a rebuilt VPS:
#   1. Copy everything below the marker to
#      /etc/nginx/sites-available/musakuce.az
#   2. Symlink it: ln -s /etc/nginx/sites-available/musakuce.az
#        /etc/nginx/sites-enabled/musakuce.az
#   3. Re-run `certbot --nginx -d musakuce.az -d www.musakuce.az` — certbot
#      will rewrite the ssl_certificate*/include lines below to point at
#      whatever fresh certificate it issues on the new host; the exact paths
#      below are only valid on the original VPS.
#   4. `nginx -t`, then `systemctl reload nginx`.
#   5. Confirm the Cloudflare CIDR list below is still current against
#      https://www.cloudflare.com/ips-v4 and /ips-v6 before trusting it —
#      Cloudflare's ranges can change, and a rebuild is exactly the moment
#      to re-verify rather than assume.
#
# No secrets in this file: only Certbot-managed certificate/key *paths*
# (not key material itself — those files live only on the VPS's own
# filesystem, protected by normal Unix permissions, never copied here) and
# Cloudflare's own publicly-published IP ranges.
#
# =============================================================================
# LIVE CONFIG BEGINS — exact copy from /etc/nginx/sites-available/musakuce.az
# =============================================================================

# Musakuce.az — shared-host Nginx config (Observer.az's own server blocks in
# sites-available/default are not touched by this file). See
# infra/nginx/musakuce.host-shared.conf.example in the repo for the
# reference this was based on.

server {
    server_name www.musakuce.az;
    return 301 https://musakuce.az$request_uri;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/musakuce.az/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/musakuce.az/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    server_name musakuce.az;

    client_max_body_size 25m;

    # Cloudflare real-IP restoration (added 2026-08-18) — resolves the
    # true visitor IP from Cloudflare's CF-Connecting-IP header into
    # $remote_addr, but only when the *directly connecting* peer is
    # actually one of Cloudflare's own published edge ranges (fetched
    # fresh from https://www.cloudflare.com/ips-v4 and /ips-v6 at the
    # time this was added — re-check periodically, Cloudflare's ranges
    # can change). Without this, $remote_addr was whichever Cloudflare
    # edge node happened to connect (confirmed in production logs:
    # 104.23.x.x / 162.158.x.x / 172.68.x.x, not real visitor IPs),
    # which broke both the API rate limiter's per-visitor partitioning
    # (Musakuce.Api/Program.cs's ForwardedHeadersMiddleware) and the
    # audit log's recorded IP.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/musakuce.az/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/musakuce.az/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = musakuce.az) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name musakuce.az;
    return 404; # managed by Certbot


}

server {
    if ($host = www.musakuce.az) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name www.musakuce.az;
    return 404; # managed by Certbot


}