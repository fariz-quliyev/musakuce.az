# /etc/nginx/sites-available/musakuce.az on the shared Contabo VPS (symlinked
# from /etc/nginx/sites-enabled/musakuce.az, which is what Nginx actually
# loads — see "Restoring this on a rebuilt VPS" below). Read directly off the
# live host on 2026-08-18, immediately after the Cloudflare real-IP fix below
